# Prediction-path configuration (core spec v2 §6).
#
# The serving path runs the FROZEN CASCADE: CF-384 as the primary expert, with
# the trained router head correcting its logit using quality descriptors and
# probe responses. This is the same system evaluated in README section 7, and it
# is the same code -- the router scores production images through
# `feature_cache.extract_feature_blocks`, the one function that also produced
# every row the router was fitted on.
#
# The threshold below is NOT the operative one and is not read when
# `fusion: router`. The live boundary comes from the validated threshold
# artifact named under `router:`, because a YAML file carries no provenance and
# is trivially edited, whereas the artifact is schema-checked and hashed. The
# service refuses to start if the two disagree.
schema_version: "predict-config.v1"

# Retained for the `naive_mean` baseline path only (ablations, A/B evidence).
# Still an uncalibrated Phase-0 placeholder; nothing derived from it is a result.
threshold: 0.5
threshold_provenance: "PLACEHOLDER-uncalibrated-phase0"

experts:
  - id: commfor_384
    enabled: true
    device: null        # null = auto (mps when available, else cpu)

# `router` = the frozen cascade (default). `naive_mean` = the Phase-0 single
# expert baseline, kept so the ablation can be reproduced through the same
# service rather than a second implementation.
fusion: router

router:
  checkpoint: results/router-fitting-v2/router_reliability.pt
  threshold_artifact: results/router-fitting-v2/threshold-artifact.v1.json
