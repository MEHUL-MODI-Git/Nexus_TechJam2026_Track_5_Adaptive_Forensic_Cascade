[project]
name = "adaptive-forensic-cascade"
version = "0.1.0"
description = "Robust AI-generated-image detection under real-world transformations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5.0,<6",
    "huggingface-hub>=0.28",
    "imagehash>=4.3",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "safetensors>=0.5",
    "timm>=1.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
